<!-- Supabase dashboard → Authentication → Emails → Templates → Reset password.
     Subject: Reset your CoopInsight AI password
     Matches the "Magic link or OTP" email: same heading, subtitle and green code box. -->
<div style="font-family:Arial,Helvetica,sans-serif;max-width:600px;margin:0 auto;padding:24px;background:#FFFFFF;">
  <h2 style="margin:0 0 8px;font-size:24px;font-weight:bold;color:#2D6A4F;">CoopInsight AI</h2>
  <p style="margin:0 0 28px;font-size:16px;color:#6B7280;">Gasabo District Cooperative Platform</p>

  <p style="margin:0 0 28px;font-size:17px;color:#374151;">Use this code to reset your password. It expires in 5 minutes.</p>

  <div style="background:#2D6A4F;border-radius:8px;padding:28px 16px;text-align:center;">
    <span style="font-size:36px;font-weight:bold;letter-spacing:12px;color:#FFFFFF;">{{ .Token }}</span>
  </div>

  <p style="margin:28px 0 0;font-size:14px;color:#6B7280;">If you did not ask to reset your password, you can ignore this email. Your password has not changed.</p>
</div>
